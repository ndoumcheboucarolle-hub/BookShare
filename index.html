<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BookShare</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#2b2420; --paper:#faf7f2; --accent:#5a6b4f; --accent-dark:#3f4d38;
    --line:#ddd5c8; --danger:#9b4a3f;
  }
  *{box-sizing:border-box}
  body{
    font-family: Georgia, 'Times New Roman', serif;
    background:var(--paper); color:var(--ink);
    max-width:640px; margin:0 auto; padding:24px 18px 60px;
    line-height:1.5;
  }
  h1{font-size:1.6rem; margin:0 0 4px; letter-spacing:-0.01em}
  .sub{color:#776f63; font-size:.9rem; margin-bottom:24px}
  nav{display:flex; gap:0; border-bottom:1px solid var(--line); margin-bottom:20px}
  nav button{
    font-family:inherit; background:none; border:none; padding:10px 14px;
    cursor:pointer; font-size:.95rem; color:#776f63; border-bottom:2px solid transparent;
  }
  nav button.active{color:var(--ink); border-bottom-color:var(--accent); font-weight:bold}
  section{display:none}
  section.active{display:block}
  label{display:block; font-size:.85rem; color:#776f63; margin:12px 0 4px}
  input,select{
    width:100%; padding:9px 10px; font-family:inherit; font-size:1rem;
    border:1px solid var(--line); border-radius:3px; background:#fff;
  }
  button.btn{
    font-family:inherit; margin-top:16px; padding:10px 16px; font-size:.95rem;
    background:var(--accent); color:#fff; border:none; border-radius:3px; cursor:pointer;
  }
  button.btn:hover{background:var(--accent-dark)}
  button.btn.small{margin-top:0; padding:6px 10px; font-size:.82rem}
  .card{
    border:1px solid var(--line); border-radius:4px; padding:14px; margin-bottom:12px;
    background:#fff; display:flex; justify-content:space-between; align-items:center; gap:10px;
  }
  .card .meta{font-size:.82rem; color:#776f63; margin-top:2px}
  .status{
    font-size:.75rem; padding:2px 8px; border-radius:10px; background:#eee;
    text-transform:lowercase; white-space:nowrap;
  }
  .status.disponible{background:#e4ece0; color:var(--accent-dark)}
  .status.en-attente{background:#f3e8d8; color:#8a6a2b}
  .status.emprunte{background:#eadfe8; color:#6b4a7a}
  .status.rendu{background:#dde8ee; color:#3a5a6b}
  .status.refuse{background:#f0dcd8; color:var(--danger)}
  #msg{font-size:.85rem; margin-top:10px; min-height:1.2em}
  #msg.error{color:var(--danger)}
  #msg.ok{color:var(--accent-dark)}
  #whoami{font-size:.82rem; color:#776f63; margin-bottom:16px}
  .empty{color:#9a9184; font-size:.9rem; padding:20px 0; text-align:center}
</style>
</head>
<body>

<h1>BookShare</h1>
<p class="sub">Partage de livres entre étudiants</p>

<!-- ======= Remplace ces deux valeurs par celles de ton projet Supabase ======= -->
<script>
  const SUPABASE_URL = "https://boixvmtdqmdsuqnxfkyf.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_wm_LJJqachC2TfltxWXUHw_CShtjWIw";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
</script>

<div id="auth-screen">
  <div id="msg-auth" class="sub"></div>
  <label>Email</label>
  <input id="email" type="email" placeholder="toi@universite.edu">
  <label>Mot de passe</label>
  <input id="password" type="password" placeholder="••••••••">
  <button class="btn" id="btn-signup">Créer un compte</button>
  <button class="btn" id="btn-login" style="background:var(--ink)">Se connecter</button>
</div>

<div id="app-screen" style="display:none">
  <div id="whoami"></div>
  <nav>
    <button data-tab="browse" class="active">Livres disponibles</button>
    <button data-tab="add">Ajouter un livre</button>
    <button data-tab="mine">Mes livres / demandes</button>
  </nav>

  <section id="tab-browse" class="active">
    <div id="book-list"><p class="empty">Chargement…</p></div>
  </section>

  <section id="tab-add">
    <label>Titre</label>
    <input id="new-title" placeholder="Ex: Design Patterns, Gang of Four">
    <label>Matière / catégorie</label>
    <input id="new-subject" placeholder="Ex: Génie logiciel">
    <button class="btn" id="btn-add-book">Publier ce livre</button>
  </section>

  <section id="tab-mine">
    <h3 style="font-size:1rem">Mes livres</h3>
    <div id="my-books"><p class="empty">—</p></div>
    <h3 style="font-size:1rem; margin-top:24px">Demandes sur mes livres</h3>
    <div id="incoming-requests"><p class="empty">—</p></div>
    <h3 style="font-size:1rem; margin-top:24px">Mes demandes d'emprunt</h3>
    <div id="my-requests"><p class="empty">—</p></div>
  </section>

  <button class="btn" id="btn-logout" style="background:transparent;color:var(--danger);border:1px solid var(--danger);margin-top:30px">Se déconnecter</button>
</div>

<div id="msg"></div>

<script>
let currentUser = null;

// ---------- SÉCURITÉ : échappe le texte avant de l'afficher ----------
function esc(value){
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// "emprunté" -> "emprunte", "en attente" -> "en-attente" (pour les classes CSS)
function statusClass(s){
  return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/ /g, '-');
}

function showMsg(text, type){
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = type || '';
}

// ---------- AUTH ----------
document.getElementById('btn-signup').onclick = async () => {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const { error } = await sb.auth.signUp({ email, password });
  if (error) { document.getElementById('msg-auth').textContent = error.message; return; }
  document.getElementById('msg-auth').textContent = "Compte créé — connecte-toi.";
};

document.getElementById('btn-login').onclick = async () => {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { document.getElementById('msg-auth').textContent = error.message; return; }
  currentUser = data.user;
  enterApp();
};

document.getElementById('btn-logout').onclick = async () => {
  await sb.auth.signOut();
  currentUser = null;
  document.getElementById('app-screen').style.display = 'none';
  document.getElementById('auth-screen').style.display = 'block';
};

async function enterApp(){
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'block';
  document.getElementById('whoami').textContent = "Connectée en tant que " + currentUser.email;
  await loadBrowse();
  await loadMine();
}

// ---------- NAV ----------
document.querySelectorAll('nav button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  };
});

// ---------- REPOSITORY (accès data) ----------
const BookRepository = {
  async listAvailable(){
    const { data, error } = await sb.from('books').select('*').eq('status','disponible').order('created_at',{ascending:false});
    if (error) throw error;
    return data;
  },
  async listMine(ownerId){
    const { data } = await sb.from('books').select('*').eq('owner_id', ownerId);
    return data || [];
  },
  async create(book){
    const { error } = await sb.from('books').insert(book);
    if (error) throw error;
  },
  async updateStatus(id, status){
    const { error } = await sb.from('books').update({ status }).eq('id', id);
    if (error) throw error;
  },
  async remove(id){
    const { error } = await sb.from('books').delete().eq('id', id);
    if (error) throw error;
  }
};

const RequestRepository = {
  async create(req){
    const { error } = await sb.from('requests').insert(req);
    if (error) throw error;
  },
  async incomingFor(bookIds){
    if (!bookIds.length) return [];
    const { data } = await sb.from('requests').select('*, books(title)').in('book_id', bookIds);
    return data || [];
  },
  async mine(requesterId){
    const { data } = await sb.from('requests').select('*, books(title)').eq('requester_id', requesterId);
    return data || [];
  },
  async setStatus(id, status){
    const { error } = await sb.from('requests').update({ status }).eq('id', id);
    if (error) throw error;
  },
  async setStatusForBook(bookId, from, to){
    const { error } = await sb.from('requests').update({ status: to })
      .eq('book_id', bookId).eq('status', from);
    if (error) throw error;
  }
};

// ---------- BROWSE ----------
async function loadBrowse(){
  const list = document.getElementById('book-list');
  try {
    const books = await BookRepository.listAvailable();
    if (!books.length){ list.innerHTML = '<p class="empty">Aucun livre disponible pour l\'instant.</p>'; return; }
    list.innerHTML = books.map(b => `
      <div class="card">
        <div>
          <strong>${esc(b.title)}</strong>
          <div class="meta">${esc(b.subject)}</div>
        </div>
        ${b.owner_id === currentUser.id
          ? '<span class="status disponible">le tien</span>'
          : `<button class="btn small" onclick="requestBook('${esc(b.id)}')">Demander</button>`}
      </div>`).join('');
  } catch(e){ list.innerHTML = '<p class="empty">Erreur de chargement.</p>'; }
}

// Le demandeur crée seulement la demande. Le statut du livre ne change
// que quand le propriétaire accepte (voir respond).
async function requestBook(bookId){
  try {
    await RequestRepository.create({ book_id: bookId, requester_id: currentUser.id, status: 'en attente' });
    showMsg('Demande envoyée.', 'ok');
    await loadMine();
  } catch(e){
    if (e.code === '23505'){
      showMsg('Tu as déjà une demande en attente pour ce livre.', 'error');
    } else {
      showMsg('Erreur: ' + e.message, 'error');
    }
  }
}

// ---------- ADD BOOK ----------
document.getElementById('btn-add-book').onclick = async () => {
  const title = document.getElementById('new-title').value.trim();
  const subject = document.getElementById('new-subject').value.trim();
  if (!title){ showMsg('Le titre est obligatoire.', 'error'); return; }
  try {
    await BookRepository.create({ title, subject, owner_id: currentUser.id, status: 'disponible' });
    document.getElementById('new-title').value = '';
    document.getElementById('new-subject').value = '';
    showMsg('Livre publié.', 'ok');
    await loadBrowse();
    await loadMine();
  } catch(e){ showMsg('Erreur: ' + e.message, 'error'); }
};

// ---------- MINE (livres + demandes) ----------
async function loadMine(){
  const myBooks = await BookRepository.listMine(currentUser.id);
  const myBooksEl = document.getElementById('my-books');
  myBooksEl.innerHTML = myBooks.length ? myBooks.map(b => `
    <div class="card">
      <div><strong>${esc(b.title)}</strong><div class="meta">${esc(b.subject)}</div></div>
      <div style="display:flex;gap:6px;align-items:center">
        <span class="status ${statusClass(b.status)}">${esc(b.status)}</span>
        ${b.status === 'emprunté'
          ? `<button class="btn small" onclick="markReturned('${esc(b.id)}')">Marquer comme rendu</button>`
          : ''}
        ${b.status !== 'emprunté'
          ? `<button class="btn small" style="background:var(--danger)" onclick="deleteBook('${esc(b.id)}')">Supprimer</button>`
          : ''}
      </div>
    </div>`).join('') : '<p class="empty">Tu n\'as pas encore publié de livre.</p>';

  const incoming = await RequestRepository.incomingFor(myBooks.map(b=>b.id));
  const incomingEl = document.getElementById('incoming-requests');
  incomingEl.innerHTML = incoming.length ? incoming.map(r => `
    <div class="card">
      <div><strong>${esc(r.books?.title)}</strong><div class="meta">statut: ${esc(r.status)}</div></div>
      ${r.status === 'en attente' ? `
        <div style="display:flex;gap:6px">
          <button class="btn small" onclick="respond('${esc(r.id)}','${esc(r.book_id)}',true)">Accepter</button>
          <button class="btn small" style="background:var(--danger)" onclick="respond('${esc(r.id)}','${esc(r.book_id)}',false)">Refuser</button>
        </div>` : ''}
    </div>`).join('') : '<p class="empty">Aucune demande en attente.</p>';

  const mine = await RequestRepository.mine(currentUser.id);
  const minReqEl = document.getElementById('my-requests');
  minReqEl.innerHTML = mine.length ? mine.map(r => `
    <div class="card">
      <div><strong>${esc(r.books?.title)}</strong></div>
      <span class="status ${statusClass(r.status)}">${esc(r.status)}</span>
    </div>`).join('') : '<p class="empty">Tu n\'as fait aucune demande.</p>';
}

async function respond(requestId, bookId, accepted){
  try {
    if (accepted){
      await RequestRepository.setStatus(requestId, 'emprunté');
      await BookRepository.updateStatus(bookId, 'emprunté');
      // les autres demandes en attente sur ce livre sont refusées automatiquement
      await RequestRepository.setStatusForBook(bookId, 'en attente', 'refusé');
    } else {
      await RequestRepository.setStatus(requestId, 'refusé');
    }
    showMsg(accepted ? 'Demande acceptée.' : 'Demande refusée.', 'ok');
    await loadMine();
    await loadBrowse();
  } catch(e){ showMsg('Erreur: ' + e.message, 'error'); }
}

async function markReturned(bookId){
  try {
    await RequestRepository.setStatusForBook(bookId, 'emprunté', 'rendu');
    await BookRepository.updateStatus(bookId, 'disponible');
    showMsg('Livre marqué comme rendu.', 'ok');
    await loadMine();
    await loadBrowse();
  } catch(e){ showMsg('Erreur: ' + e.message, 'error'); }
}

async function deleteBook(bookId){
  if (!confirm('Supprimer ce livre et ses demandes ?')) return;
  try {
    await BookRepository.remove(bookId);
    showMsg('Livre supprimé.', 'ok');
    await loadMine();
    await loadBrowse();
  } catch(e){ showMsg('Erreur: ' + e.message, 'error'); }
}

// ---------- session check au chargement ----------
(async () => {
  const { data } = await sb.auth.getSession();
  if (data.session){ currentUser = data.session.user; enterApp(); }
})();
</script>

</body>
</html>
